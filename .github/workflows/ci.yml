name: Sahayak AI Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Verification
        run: npm run lint

      - name: TypeScript Static Type Checking
        run: npm run typecheck

      - name: Verify Production Application Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: "https://sahayak-ai-demo.cloud.run"

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high || true
